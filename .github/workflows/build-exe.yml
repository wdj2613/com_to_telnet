name: 构建 Windows exe

# 什么时候跑：
#   - 推送到 main / 向 main 发 PR：验证代码能跑通并产出 exe
#   - 推 v* 标签（例如 v1.0.0）：额外自动创建 Release，把 exe 挂上去
#   - 也可以在 Actions 页面手动点 “Run workflow”
on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

# 同一个分支连着推多次时，取消上一次还在跑的构建，省 Actions 额度
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: PyInstaller 打包（Windows x64 / Python 3.9）
    runs-on: windows-latest

    env:
      # 与本机验证过的版本保持一致，避免 CI 因为 PyInstaller 升级而突然失败
      PYINSTALLER_VERSION: '6.22.3'

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      # 项目要求所有运行都在虚拟环境里，这里也照做：
      # build_exe.ps1 / run.bat 都会直接使用 .venv
      - name: 创建虚拟环境并安装 PyInstaller
        shell: pwsh
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install --upgrade pip
          .\.venv\Scripts\python.exe -m pip install "pyinstaller==$env:PYINSTALLER_VERSION"
          .\.venv\Scripts\python.exe -m PyInstaller --version

      - name: 功能自测（92 项，用 loop:// 回环，不需要真实串口）
        shell: pwsh
        run: .\.venv\Scripts\python.exe tests\selftest.py

      - name: 界面冒烟测试（99 项，需要桌面会话，失败不阻断打包）
        shell: pwsh
        continue-on-error: true
        run: .\.venv\Scripts\python.exe tests\gui_smoke.py

      - name: 生成图标并打包（-All：单文件版 + 免解包绿色版，共 4 个产物）
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\build_exe.ps1 -All

      - name: 冒烟验证 exe 真的能启动
        shell: pwsh
        run: |
          .\dist\com-telnet-cli.exe --version
          .\dist\com-telnet-cli.exe --list-ports
          # 机器上没有串口时 --list-ports 按设计返回 1，不算失败
          if ($LASTEXITCODE -ne 0 -and $LASTEXITCODE -ne 1) {
            throw "exe 异常退出，退出码 $LASTEXITCODE"
          }

      - name: 整理发布文件（附件名只能是 ASCII，中文会被 GitHub 改名甚至丢掉）
        shell: pwsh
        run: |
          $out = 'dist\release'
          Remove-Item $out -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force $out | Out-Null
          Copy-Item 'dist\COM_To_Telnet.exe'  "$out\COM_To_Telnet.exe"
          Copy-Item 'dist\com-telnet-cli.exe' "$out\com-telnet-cli.exe"
          Copy-Item 'dist\说明.txt'           "$out\readme-zh.txt"
          Compress-Archive -Path 'dist\onedir\COM_To_Telnet\*' -DestinationPath "$out\COM_To_Telnet-onedir.zip" -Force
          Compress-Archive -Path 'dist\onedir\com-telnet-cli\*' -DestinationPath "$out\com-telnet-cli-onedir.zip" -Force
          Get-ChildItem $out | Format-Table Name, @{n='MB';e={[math]::Round($_.Length/1MB,2)}}
          foreach ($f in 'COM_To_Telnet.exe','com-telnet-cli.exe','readme-zh.txt',
                         'COM_To_Telnet-onedir.zip','com-telnet-cli-onedir.zip') {
            if (-not (Test-Path "$out\$f")) { throw "发布文件缺失：$f" }
          }

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: COM-Telnet-gateway-win-x64
          if-no-files-found: error
          retention-days: 30
          path: dist/release/**

      - name: 清掉该标签下残留的旧 Release（避免改名后的垃圾附件留在页面上）
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $headers = @{
            Authorization          = "Bearer $env:GH_TOKEN"
            Accept                 = 'application/vnd.github+json'
            'X-GitHub-Api-Version' = '2022-11-28'
          }
          $api = "https://api.github.com/repos/${{ github.repository }}"
          $tag = '${{ github.ref_name }}'
          try {
            $rel = Invoke-RestMethod -Uri "$api/releases/tags/$tag" -Headers $headers -Method Get
          } catch {
            Write-Host "标签 $tag 下还没有 Release，直接新建"
            exit 0
          }
          $n = @($rel.assets).Count
          Write-Host "删除标签 $tag 下的旧 Release（id=$($rel.id)，$n 个附件）"
          Invoke-RestMethod -Uri "$api/releases/$($rel.id)" -Headers $headers -Method Delete | Out-Null
          Write-Host "已删除，接下来重建"

      # 触发条件保持"推 v* 标签才发版"不变；
      # draft: true 表示先建成草稿（只有仓库成员能看到），
      # 到 Releases 页面点 “Publish release” 之后才对所有人可见。
      - name: 打 tag 时发布 Release（草稿，需手动点发布）
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: COM 串口转 Telnet 网关 ${{ github.ref_name }}
          fail_on_unmatched_files: true
          draft: true
          body: |
            Windows x64 免安装版，解压/双击即用，不需要装 Python，也不需要装 .NET。

            | 附件 | 说明 |
            | --- | --- |
            | `COM_To_Telnet.exe` | **图形界面**，单文件版，双击运行（首次启动自解压约 1~2 秒） |
            | `com-telnet-cli.exe` | **命令行版**，例如 `com-telnet-cli.exe -p COM3 -b 115200 -t 2323` |
            | `COM_To_Telnet-onedir.zip` | 图形界面，免解包绿色版（杀软拦自解压、或想放到 U 盘时用这个） |
            | `com-telnet-cli-onedir.zip` | 命令行，免解包绿色版 |
            | `readme-zh.txt` | 防火墙放行、使用注意事项 |

            用法：双击 `COM_To_Telnet.exe` → 选串口（插上 USB 转串口线后点“刷新”）→ 点“启动” →
            别的机器 `telnet <这台机器的IP> 2323` 就能连上看串口数据，多个客户端可以同时连。
            需要多个串口同时转发时，点左侧“＋ 新建”加通道，端口会自动分配 2323、2324…

            第一次运行如果 Windows 防火墙弹窗，请勾选“专用网络”并允许，否则局域网内其他机器连不上 2323 端口。
            详细用法见仓库 [README](https://github.com/wdj2613/com_to_telnet#readme)。
          files: |
            dist/release/COM_To_Telnet.exe
            dist/release/com-telnet-cli.exe
            dist/release/COM_To_Telnet-onedir.zip
            dist/release/com-telnet-cli-onedir.zip
            dist/release/readme-zh.txt
